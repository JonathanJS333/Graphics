<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foundation Starter Template</title>
    <!-- Compressed CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/index.css">
    </head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">Canvas</a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">No se</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Algo</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Aquí</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card text-center">
                    <div class="card-header py-3">Visualización de Datos</div>
                    
                    <div class="p-4">
                        <canvas id="circlechart" width="700" height="400"></canvas>
                    </div>

                    <div class="card-body bg-light rounded-bottom">
                        <h6 class="text-uppercase mb-3" style="font-size: 0.75rem; letter-spacing: 2px;">Entrada de Parámetros</h6>
                        <div class="input-group mb-3 mx-auto" style="max-width: 600px;">
                            <input type="text" id="datosGrafica" class="form-control shadow-none" placeholder="Ingresa valores (ej. 45, 80, 20...)" style="border-radius: 8px 0 0 8px;">
                            <button class="btn btn-primary" type="button" id="btnDibujar">Dibujar</button>
                        </div>
                        <p class="text-muted small">El área de dibujo se dibujara automáticamente según los valores.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer id="footer" class="pb-5 pt-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 text-center text-md-start">
                    <h5 class="mb-0">GraphLab</h5>
                    <p class="small opacity-50">Proyecto de Graficación</p>
                </div>
                <div class="col-md-8">
                    <div class="row text-center text-md-end">
                        <div class="col"><a href="#">Documentación</a></div>
                        <div class="col"><a href="https://github.com/jorrgeCruz/graphics">Github</a></div>
                    </div>
                </div>
            </div>
            <hr class="mt-4 opacity-25">
            <p class="text-center small opacity-50">© 2026 Graficación FC Uabjo</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./dist/src/index.js" type="module"></script>
</body>
</html>
